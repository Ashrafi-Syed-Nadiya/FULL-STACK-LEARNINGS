<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <!-- CSS STYLE -->
    <!-- <style>
        table,tr,th,td {

</head>
<body>
    <h1>TABLES</h1>
    <table border="4">
        <tr>
            <th  rowspan="2" >Heading-1</th>
            <th>Heading-2</th>
        </tr>
        
        <tr>
            <td colspan="2" >Data-11</td>
            <td>Data-12</td>
        </tr>
        <tr>
            <td rowspan="2">Data-21</td>
            <td>Data-22</td>
        </tr>

        <tr>
            <td colspan="3">Data 31</td>
            <td>Data32</td>
        </tr>

        <tr>
            <td>Data-41</td>
        </tr>
    </table>

    
</body>
</html>

<!-- 
         ___________________________________________________
        | Tag         | Description                         |
        | ----------- | ----------------------------------- |
        | `<table>`   | Defines the table                   |
        | `<tr>`      | Table row                           |
        | `<th>`      | Table header cell (bold & centered) |
        | `<td>`      | Table data cell                     |
        | `<caption>` | Table title                         |
        | `<thead>`   | Header section                      |
        | `<tbody>`   | Body section                        |
        | `<tfoot>`   | Footer section                      |
        -----------------------------------------------------

        => Table and all its tags are BLOCK LEVEL ELEMENTS
        
        ### ✅ **Table and its tags are NOT inline elements**
         ## 🔹 Display type of table elements

        | HTML Tag    | Display Type               |
        | ----------- | -------------------------- |
        | `<table>`   | **Block-level element**    |
        | `<tr>`      | Table row (not inline)     |
        | `<th>`      | Table cell (table-cell)    |
        | `<td>`      | Table cell (table-cell)    |
        | `<thead>`   | Table header group         |
        | `<tbody>`   | Table body group           |
        | `<tfoot>`   | Table footer group         |
        | `<caption>` | Block-like (table-caption) |

        📌 Makes a cell span multiple columns/rows - <th><td> tag attributes
            rowspan  - Merge (rows) cells VERTICALLY | |
            colspan  - Merge (cols) cells HORIZONTALLY =

        📌 **None of these are inline elements.**
        ## 🔹 Why tables are NOT inline
        * Inline elements flow **inside text** (`<span>`, `<a>`, `<strong>`)
        * Tables create **their own layout structure**
        * Tables **start on a new line** like block elements

        Example:

        ```html
        Text before
        <table border="1">
        <tr><td>Cell</td></tr>
        </table>
        Text after
        ```

        ➡ The table appears on a **new line**, not inline with text.

        ---

        ## 🔹 Correct exam statement

        ✅ **Table and its related tags are block-level / table elements, not inline elements.**

        ---

        ## 🔹 Common inline elements (for comparison)

        * `<span>`
        * `<a>`
        * `<b>`
        * `<i>`
        * `<img>`
